# Proyecto de Xcode de Flecha para iPhone y iPad, descrito con XcodeGen.
# Flecha.xcodeproj se genera con `xcodegen` dentro de esta carpeta y va incluido
# en el repositorio para que baste con abrirlo.
name: Flecha
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
configFiles:
  Debug: Firma.xcconfig
  Release: Firma.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Flecha:
    type: application
    platform: iOS
    sources:
      - App
      - Compartido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLECHA_PREFIJO).flecha
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Flecha.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: FlechaWidget
  FlechaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Compartido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLECHA_PREFIJO).flecha.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/FlechaWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
